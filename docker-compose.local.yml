services:
  db:
    image: postgres:16-alpine
    container_name: warehouse_db_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse_db_local_data:/var/lib/postgresql/data

  be:
    build:
      context: ./warehouse-management-be
      dockerfile: Dockerfile.dev
    container_name: warehouse_be_local
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: warehouse
      DB_PASSWORD: warehouse
      DB_NAME: warehouse
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./warehouse-management-be:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  warehouse_db_local_data:
